[workspace]
resolver = "3"
members = [
    "crates/pomotui-cli",
    "crates/pomotui-domain",
    "crates/pomotui-platform",
    "crates/pomotui-protocol",
    "crates/pomotui-service",
    "crates/pomotui-tray",
    "crates/pomotui-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
