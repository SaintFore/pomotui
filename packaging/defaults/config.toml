focus_minutes = 25
short_break_minutes = 5
long_break_minutes = 15
rounds_per_cycle = 4
theme = "Vermilion Paper Dark"
# Built-ins: Vermilion Paper Light, Vermilion Paper Dark,
# Ran Paper Light, Ran Paper Dark
language = "en"
reminder_enabled = true
volume = 100
