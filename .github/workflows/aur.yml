name: Non-publishing AUR diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Manual AUR publishing has been removed. Approved release PR merges and verified main changes use the candidate and real-upgrade gates.'
          echo 'Rerun the original verified publication to retry its same recorded candidate; do not publish untested recipes.' >> "$GITHUB_STEP_SUMMARY"
