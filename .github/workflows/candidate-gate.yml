name: Verified Linux candidate
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      intent:
        type: string
        default: git
    outputs:
      artifact:
        value: ${{ jobs.gate.outputs.artifact }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.intent }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source }}
      CANDIDATE_INTENT: ${{ inputs.intent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Require exact committed source and allowed intent
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          [[ "$CANDIDATE_INTENT" == git || "$CANDIDATE_INTENT" == stable ]]
      - name: Restore the original accepted bytes on same-run retry
        id: restore
        run: >-
          python3 packaging/release/restore.py --optional --run-id "${{ github.run_id }}"
          --intent "$CANDIDATE_INTENT" --source "$SOURCE_COMMIT"
          --candidate "$RUNNER_TEMP/candidate" --selection "$RUNNER_TEMP/restored-selection"
          --output "$RUNNER_TEMP/restore.json"
      - name: Install repository Rust toolchain
        if: steps.restore.outputs.restored != 'true'
        run: rustup toolchain install
      - name: Applicable checks for the recorded source
        if: steps.restore.outputs.restored != 'true'
        run: |
          cargo fmt --all --check
          sh packaging/tests/aur-install.sh
          python3 -m unittest discover -s tests/release -p '*_test.py'
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo build --workspace
          cargo build --release --workspace
          tests/e2e.sh
          tests/reservations-e2e.sh
          sh tests/reservation-failure-e2e.sh
      - name: Prepare candidate from the same source
        if: steps.restore.outputs.restored != 'true'
        run: |
          if [[ "$CANDIDATE_INTENT" == stable ]]; then
            python3 packaging/release/candidate.py plan --source "$SOURCE_COMMIT" --intent stable --notes RELEASE_NOTES.md --output "$RUNNER_TEMP/candidate"
          else
            python3 packaging/release/candidate.py plan --source "$SOURCE_COMMIT" --output "$RUNNER_TEMP/candidate"
          fi
          python3 - <<'PY'
          import json,os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate/checks.json').write_text(json.dumps({'source_commit':os.environ['SOURCE_COMMIT'],'passed':True})+'\n')
          PY
      - name: Build recorded real packages
        if: steps.restore.outputs.restored != 'true'
        run: python3 packaging/release/candidate.py build --output "$RUNNER_TEMP/candidate"
      - name: Required clean install, domain, migration and lifecycle acceptance
        if: steps.restore.outputs.restored != 'true'
        run: |
          tests/release/verify-candidate.sh "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/acceptance"
          cp "$RUNNER_TEMP/acceptance/acceptance.json" "$RUNNER_TEMP/candidate/acceptance.json"
          python3 packaging/release/release.py verify-gates --candidate "$RUNNER_TEMP/candidate" --checks "$RUNNER_TEMP/candidate/checks.json" --acceptance "$RUNNER_TEMP/candidate/acceptance.json"
      - name: Retain every manifest artifact without build caches
        run: python3 packaging/release/release.py pack --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 90
          name: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.intent }}
          path: ${{ runner.temp }}/portable
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: gate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.intent }}
          path: |
            ${{ runner.temp }}/acceptance/**/*.log
            ${{ runner.temp }}/acceptance/**/*.json
            ${{ runner.temp }}/acceptance/**/*.txt
            ${{ runner.temp }}/acceptance/**/*.sha256
            ${{ runner.temp }}/candidate/*.log
            ${{ runner.temp }}/candidate/candidate.json
          include-hidden-files: true
