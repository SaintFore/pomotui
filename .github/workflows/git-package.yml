name: Verified Git package

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  select:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      source: ${{ steps.select.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select relevant committed source changes
        id: select
        run: |
          python3 packaging/release/git_refresh.py select --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" <<'PY'
          import json, os, sys
          result = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('selected=' + str(result['selected']).lower(), file=output)
              print('source=' + result['source_commit'], file=output)
          PY
          cat "$RUNNER_TEMP/selection.json" >> "$GITHUB_STEP_SUMMARY"
  gate:
    needs: select
    if: needs.select.outputs.selected == 'true'
    uses: ./.github/workflows/candidate-gate.yml
    with:
      source: ${{ needs.select.outputs.source }}
      intent: git
  publish:
    needs: [select, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pomotui-aur-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Restore original identity and previous publication journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 packaging/release/restore.py --run-id "${{ github.run_id }}" --intent git
          --source "${{ needs.select.outputs.source }}" --candidate "$RUNNER_TEMP/candidate"
          --selection "$RUNNER_TEMP/selection" --journal "$RUNNER_TEMP/aur-git.json"
          --output "$RUNNER_TEMP/restored-publication.json"
      - name: Verify exact candidate, checks and real upgrade evidence
        run: >-
          python3 packaging/release/release.py verify-gates
          --candidate "$RUNNER_TEMP/candidate"
          --acceptance "$RUNNER_TEMP/candidate/acceptance.json"
          --checks "$RUNNER_TEMP/candidate/checks.json"
      - name: Preflight and publish the verified Git snapshot
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/git-publication.log") 2>&1
          umask 077
          export AUR_SSH_KEY_FILE="$RUNNER_TEMP/aur-release-key"
          trap 'rm -f "$AUR_SSH_KEY_FILE"' EXIT
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo 'Configure AUR_SSH_PRIVATE_KEY before publication.' >&2; exit 1; }
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_SSH_KEY_FILE"
          python3 packaging/release/aur.py preflight --candidate "$RUNNER_TEMP/candidate" --channel aur-git > "$RUNNER_TEMP/preflight.json"
          python3 packaging/release/git_refresh.py publish --source "${{ needs.select.outputs.source }}" --candidate "$RUNNER_TEMP/candidate" --acceptance "$RUNNER_TEMP/candidate/acceptance.json" --checks "$RUNNER_TEMP/candidate/checks.json" --output "$RUNNER_TEMP/aur-git.json"
      - name: Report delivery stage
        if: always()
        run: |
          echo 'Git-package metadata is a verified commit snapshot; user builds fetch latest upstream source.' >> "$GITHUB_STEP_SUMMARY"
          for report in "$RUNNER_TEMP/preflight.json" "$RUNNER_TEMP/aur-git.json"; do
            if test -s "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "Retry: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: git-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/git-publication.log
            ${{ runner.temp }}/preflight.json
            ${{ runner.temp }}/aur-git.json
            ${{ runner.temp }}/restored-publication.json
          if-no-files-found: warn

  report:
    needs: [select, gate, publish]
    if: always() && (needs.select.outputs.selected == 'true' || needs.select.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verified-candidate-*-git
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: git-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - name: Report a verified snapshot or the failed prerequisite
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: |
          printf '%s\n' "$JOB_RESULTS" > "$RUNNER_TEMP/jobs.json"
          python3 packaging/release/report.py --intent git --candidate "$RUNNER_TEMP/candidate" --journal "$RUNNER_TEMP/publication/aur-git.json" --jobs "$RUNNER_TEMP/jobs.json" --source "$SOURCE" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output "$RUNNER_TEMP/delivery-report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: delivery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-report.md
            ${{ runner.temp }}/jobs.json
