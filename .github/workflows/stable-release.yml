name: Verified stable release
on:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  select:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      intent: ${{ steps.select.outputs.intent }}
      source: ${{ steps.select.outputs.source }}
      artifact: stable-selection-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicit release PR, version, notes and final-source approval
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/selection.log") 2>&1
          python3 packaging/release/release.py select --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" <<'PY'
          import json,os,sys
          result=json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('intent='+result['intent'],file=output)
              print('source='+result.get('source_commit',''),file=output)
          PY
          cat "$RUNNER_TEMP/selection.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: stable-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/selection.log
          if-no-files-found: warn
  gate:
    needs: select
    if: needs.select.outputs.intent == 'stable'
    uses: ./.github/workflows/candidate-gate.yml
    with:
      source: ${{ needs.select.outputs.source }}
      intent: stable
  publish:
    needs: [select, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: pomotui-aur-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.select.outputs.artifact }}
          path: ${{ runner.temp }}/selection
      - name: Restore original identity and previous publication journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 packaging/release/restore.py --run-id "${{ github.run_id }}" --intent stable
          --source "${{ needs.select.outputs.source }}" --candidate "$RUNNER_TEMP/candidate"
          --selection "$RUNNER_TEMP/selection" --journal "$RUNNER_TEMP/stable-publication.json"
          --output "$RUNNER_TEMP/restored-publication.json"
      - name: Publish verified Linux and both AUR channels; verify user discovery
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stable-publication.log") 2>&1
          umask 077
          export AUR_SSH_KEY_FILE="$RUNNER_TEMP/aur-release-key"
          trap 'rm -f "$AUR_SSH_KEY_FILE"' EXIT
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo 'Configure AUR_SSH_PRIVATE_KEY; publication paused before any public writes.' >&2; exit 1; }
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$AUR_SSH_KEY_FILE"
          python3 packaging/release/release.py verify-gates --candidate "$RUNNER_TEMP/candidate" --acceptance "$RUNNER_TEMP/candidate/acceptance.json" --checks "$RUNNER_TEMP/candidate/checks.json"
          python3 packaging/release/release.py publish-stable --candidate "$RUNNER_TEMP/candidate" --acceptance "$RUNNER_TEMP/candidate/acceptance.json" --checks "$RUNNER_TEMP/candidate/checks.json" --selection "$RUNNER_TEMP/selection/selection.json" --output "$RUNNER_TEMP/stable-publication.json"
      - name: Report each required channel and aggregate discovery
        if: always()
        run: |
          echo 'Required Linux channels: GitHub, stable AUR and Git AUR. Only discoverable channels count toward completion.' >> "$GITHUB_STEP_SUMMARY"
          for report in "$RUNNER_TEMP/stable-publication-preflight.json" "$RUNNER_TEMP/stable-publication-github.json" "$RUNNER_TEMP/stable-publication.json"; do
            if test -s "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "Retry same candidate: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: stable-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stable-publication-preflight.json
            ${{ runner.temp }}/stable-publication-github.json
            ${{ runner.temp }}/stable-publication.json
            ${{ runner.temp }}/stable-publication.log
            ${{ runner.temp }}/restored-publication.json
          if-no-files-found: warn
  macos:
    needs: select
    if: needs.select.outputs.intent == 'stable'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            archive: pomotui-macos-aarch64
          - target: x86_64-apple-darwin
            archive: pomotui-macos-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - name: Build independently with source-selected Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" "$TARGET"
          cargo build --release --workspace --target "$TARGET"
          cd "target/$TARGET/release"
          bins="pomotui pomotui-tui pomotui-service"
          if test -f pomotui-tray; then bins="$bins pomotui-tray"; fi
          tar czf "$RUNNER_TEMP/$ARCHIVE.tar.gz" $bins
          cd "$RUNNER_TEMP"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.sha256"
          python3 - "$ARCHIVE" "$TARGET" <<'PYTHON'
          import hashlib,json,os,sys
          from pathlib import Path
          stem,target=sys.argv[1:]
          names=[stem+'.tar.gz',stem+'.sha256']
          receipt={'source_commit':os.environ['SOURCE'],'target':target,
              'artifacts':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}}
          Path('build.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 90
          name: ${{ matrix.archive }}-${{ needs.select.outputs.source }}
          path: |
            ${{ runner.temp }}/${{ matrix.archive }}.tar.gz
            ${{ runner.temp }}/${{ matrix.archive }}.sha256
            ${{ runner.temp }}/build.json
      - name: Report independent platform result
        if: always()
        run: echo 'macOS build result is independent of the required Linux publication gate.' >> "$GITHUB_STEP_SUMMARY"

  publish-macos:
    needs: [select, gate, publish, macos]
    # AUR may still be pending after Linux delivery. The CLI verifies Linux's
    # existing public bytes; optional jobs never create a release or tag.
    if: always() && needs.gate.result == 'success' && needs.select.outputs.intent == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        archive: [pomotui-macos-aarch64, pomotui-macos-x86_64]
    concurrency:
      group: pomotui-optional-${{ needs.select.outputs.source }}-${{ matrix.archive }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.archive }}-${{ needs.select.outputs.source }}
          path: ${{ runner.temp }}/macos
      - uses: actions/download-artifact@v4
        with:
          name: stable-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - name: Reconcile successful optional assets against the verified Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 packaging/release/release.py publish-macos
          --candidate "$RUNNER_TEMP/candidate"
          --acceptance "$RUNNER_TEMP/candidate/acceptance.json"
          --checks "$RUNNER_TEMP/candidate/checks.json"
          --publication "$RUNNER_TEMP/publication/stable-publication.json"
          --macos "$RUNNER_TEMP/macos" --output "$RUNNER_TEMP/macos-publication.json"
      - name: Report independent delivery result
        if: always()
        run: |
          echo 'Optional macOS delivery; required Linux completion does not wait for or depend on this job. Retry this job to reconcile the same retained bytes.' >> "$GITHUB_STEP_SUMMARY"
          if test -s "$RUNNER_TEMP/macos-publication.json"; then cat "$RUNNER_TEMP/macos-publication.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: ${{ matrix.archive }}-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-publication.json
          if-no-files-found: warn

  report:
    needs: [select, gate, publish]
    if: always() && (needs.select.outputs.intent == 'stable' || needs.select.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verified-candidate-*-stable
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stable-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.select.outputs.artifact }}
          path: ${{ runner.temp }}/selection
      - name: Update the release PR even when checks or publication failed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: |
          printf '%s\n' "$JOB_RESULTS" > "$RUNNER_TEMP/jobs.json"
          python3 packaging/release/report.py --intent stable --candidate "$RUNNER_TEMP/candidate" --journal "$RUNNER_TEMP/publication/stable-publication.json" --selection "$RUNNER_TEMP/selection/selection.json" --jobs "$RUNNER_TEMP/jobs.json" --source "$SOURCE" --pr "$RELEASE_PR" --comment --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output "$RUNNER_TEMP/delivery-report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 90
          name: delivery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-report.md
            ${{ runner.temp }}/jobs.json
