name: Non-publishing Linux candidate
on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'packaging/**'
      - 'tests/release/**'
      - '.github/workflows/candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release boundaries before package builds
        run: |
          python3 tests/release/check-boundaries.py
          python3 tests/release/check-boundaries.py --version 0.0.0
  candidate:
    needs: boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [git, stable-fixture]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source-identified Git candidate
        if: matrix.kind == 'git'
        run: python3 packaging/release/candidate.py plan --output "$RUNNER_TEMP/candidate"
      - name: Prepare isolated nonpublishing stable fixture
        if: matrix.kind == 'stable-fixture'
        run: tests/release/stable-candidate-fixture.sh "$RUNNER_TEMP/candidate"
      - name: Build and validate real generated package
        run: python3 packaging/release/candidate.py build --output "$RUNNER_TEMP/candidate"
      - name: Reuse identical verified build without rebuilding
        run: |
          sha256sum "$RUNNER_TEMP/candidate/candidate.json" > "$RUNNER_TEMP/candidate-before.sha256"
          python3 packaging/release/candidate.py build --output "$RUNNER_TEMP/candidate"
          sha256sum --check "$RUNNER_TEMP/candidate-before.sha256"
      - name: Require actual build evidence
        run: python3 packaging/release/candidate.py verify --output "$RUNNER_TEMP/candidate" --require-built
      - name: Pack portable candidate through the release interface
        run: python3 packaging/release/release.py pack --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.kind }}-${{ github.sha }}
          path: ${{ runner.temp }}/portable
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.kind }}-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-candidate
      - name: Verify retained candidate through consumer interface
        run: python3 packaging/release/candidate.py verify --output "$RUNNER_TEMP/downloaded-candidate" --require-built
      - name: Retain candidate diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-diagnostics-${{ matrix.kind }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate/*.log
            ${{ runner.temp }}/candidate/candidate.json
          if-no-files-found: warn
