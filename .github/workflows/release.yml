name: Non-publishing platform builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to build without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: pomotui-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: pomotui-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: pomotui-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install repository Rust toolchain and target
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" ${{ matrix.target }}
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          bins="pomotui pomotui-tui pomotui-service"
          if [ -f pomotui-tray ]; then bins="$bins pomotui-tray"; fi
          tar czf ../../../${{ matrix.archive }}.tar.gz $bins
      - name: Checksum
        run: sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.sha256
